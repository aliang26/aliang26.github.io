<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" /> 
        <link rel="stylesheet" href="style.css"> 
        <title>Subscribe</title> 
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <link rel="stylesheet" href="https://use.typekit.net/kkv2ooi.css">
    </head>	

    <body>
        <header>
            <h1><a href="index.html"><img src="sustainablelogo.svg" alt="Sustainably Styled."></a></h1>
            <nav>
                <ul>
                    <li><a href="#">Fashion</a></li>
                    <li><a href="#">Beauty</a></li>
                    <li><a href="#">Lifestyle</a></li>
                    <li><a href="photogallery.html">Brands</a></li>
                    <li><a href="newsletter.html">Subscribe</a></li>
                </ul>
            </nav>
        </header> 
        <div class="newsletter">
            <main>
                <form>
                    <section class="information">
                        <h2>Subscribe to our newsletter!</h2>
                        <ul>
                            <li><label for="name">Name:</label> <input type="text" name="name" id="name" placeholder="First and Last Name" /></li>
                            <li><label for="email">Email address:</label> <input type="email" name="email" id="email" placeholder="Enail Address" /></li>
                        </ul>
                    </section>
                    <section class="notifications">
                        <h2>What notifications would you like to receive?</h2>
                        <ul>
                            <li><input type="checkbox" id="new-articles" value="new-articles" name="notification" /> <label for="new-articles">New Articles</label></li>
                            <li><input type="checkbox" id="featured-brands" value="featured-brands" name="notification" /> <label for="featured-brands">Featured Brands</label></li>
                            <li><input type="checkbox" id="latest-trends" value="latest-trends" name="notification" /> <label for="latest-trends">Latest Trends</label></li>
                            <li><input type="checkbox" id="all-notifications" value="all-notifications" name="notification" /> <label for="all-notifications">All Notifications</label></li>
                        </ul>
                    </section>
                    <section>
                        <button type="submit">Subscribe</button>
                    </section>
                </form>
            </main>

            <img src="subscribe.jpg" alt="Person twirling around in a dress with a green pineapple pattern.">

            <footer>
                <p>All rights reserved.</p>
            </footer>
        </div>
    </body>
</html>
